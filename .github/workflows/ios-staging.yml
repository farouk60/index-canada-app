name: iOS Staging

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Envoyer l'IPA staging vérifiée vers TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-staging-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_REF: refs/heads/candidate/store-billing-entitlements-2026-09-28
  EXPECTED_VERSION_NAME: 1.1.0
  EXPECTED_BUILD_NUMBER: "27"
  STAGING_APP_ENVIRONMENT: staging
  STAGING_API_BASE_URL: https://immigrantindex.wixsite.com/website-1/_functions
  FORBIDDEN_PRODUCTION_API_BASE_URL: https://www.immigrantindex.com/_functions
  FORBIDDEN_CI_API_BASE_URL: https://ci.index-canada.example/_functions
  MOBILE_STAGING_APPROVED_SHA: ${{ vars.MOBILE_STAGING_APPROVED_SHA }}

jobs:
  staging-contract:
    name: Contrat de préproduction
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Bloquer toute branche ou configuration hors staging
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error title=Déclenchement interdit::Ce workflow accepte uniquement workflow_dispatch."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "$EXPECTED_SOURCE_REF" ]]; then
            echo "::error title=Branche interdite::Le workflow staging doit être lancé depuis $EXPECTED_SOURCE_REF, pas $GITHUB_REF."
            exit 1
          fi
          if [[ -z "$MOBILE_STAGING_APPROVED_SHA" ]]; then
            echo "::error title=SHA staging non approuvé::La variable GitHub MOBILE_STAGING_APPROVED_SHA doit être configurée hors de la branche."
            exit 1
          fi
          if [[ ! "$MOBILE_STAGING_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=SHA staging invalide::MOBILE_STAGING_APPROVED_SHA doit contenir exactement 40 caractères hexadécimaux minuscules."
            exit 1
          fi
          if [[ "$MOBILE_STAGING_APPROVED_SHA" != "$GITHUB_SHA" ]]; then
            echo "::error title=Commit staging non approuvé::Le commit exécuté ne correspond pas au SHA approuvé hors branche."
            exit 1
          fi
          if [[ "$STAGING_APP_ENVIRONMENT" != "staging" ]]; then
            echo "::error title=Environnement interdit::APP_ENVIRONMENT doit rester staging."
            exit 1
          fi
          if [[ "$STAGING_API_BASE_URL" != "https://immigrantindex.wixsite.com/website-1/_functions" ]]; then
            echo "::error title=URL staging inattendue::L'URL doit viser exactement le backend Wix de préproduction."
            exit 1
          fi
          if [[ "$STAGING_API_BASE_URL" == "$FORBIDDEN_PRODUCTION_API_BASE_URL" || \
                "$STAGING_API_BASE_URL" == "$FORBIDDEN_CI_API_BASE_URL" || \
                "$STAGING_API_BASE_URL" == *"www.immigrantindex.com"* || \
                "$STAGING_API_BASE_URL" == *"ci.index-canada.example"* ]]; then
            echo "::error title=URL interdite::Une IPA staging ne peut viser ni la production ni le faux backend CI."
            exit 1
          fi

          version_value="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          expected_version="$EXPECTED_VERSION_NAME+$EXPECTED_BUILD_NUMBER"
          if [[ "$version_value" != "$expected_version" ]]; then
            echo "::error title=Version staging inattendue::pubspec.yaml doit déclarer exactement $expected_version, valeur détectée : $version_value."
            exit 1
          fi

          echo "Contrat staging validé : $GITHUB_REF, $expected_version, $STAGING_API_BASE_URL."

  release-quality:
    name: Analyse et tests avant staging
    needs: staging-contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Refuser les fichiers sensibles suivis
        shell: bash
        run: |
          set -euo pipefail

          sensitive_files="$({
            git ls-files -- lib android ios backend pubspec.yaml pubspec.lock \
              | grep -E '(^|/)(\.env($|\.)|key\.properties$|service-account[^/]*\.json$|[^/]+\.(jks|keystore|p8|p12|pfx|pem|key|mobileprovision|provisionprofile)$)' \
              | grep -Ev '(\.example|\.sample|\.template)$'
          } || true)"

          if [[ -n "$sensitive_files" ]]; then
            echo "::error title=Fichier sensible suivi::Un fichier sensible est versionné."
            printf '%s\n' "$sensitive_files"
            exit 1
          fi

      - name: Refuser les secrets intégrés au code mobile ou backend
        shell: bash
        run: |
          set -euo pipefail

          secret_files="$({
            git grep -Il -E \
              '(sk_(live|test)_[[:alnum:]]{16,}|rk_(live|test)_[[:alnum:]]{16,}|whsec_[[:alnum:]]{16,}|AIza[[:alnum:]_-]{30,}|AKIA[0-9A-Z]{16}|gh[pousr]_[[:alnum:]]{20,}|-----BEGIN ((RSA|EC|OPENSSH) )?PRIVATE KEY-----)' \
              -- lib android ios backend pubspec.yaml pubspec.lock
          } || true)"

          if [[ -n "$secret_files" ]]; then
            echo "::error title=Secret potentiel détecté::Le contenu sensible n'est jamais affiché; seuls les fichiers concernés suivent."
            printf '%s\n' "$secret_files"
            exit 1
          fi

      - name: Bloquer le paiement Stripe natif dans la livraison mobile
        shell: bash
        run: |
          set -euo pipefail

          violations="$({
            git grep -nI -E \
              'flutter_stripe|stripe_native_payment_service|StripeNativePaymentService|Stripe\.(instance|publishableKey|urlScheme)|STRIPE_(PUBLISHABLE_KEY|URL_SCHEME)|PaymentSheet|flutterstripe' \
              -- \
              lib \
              pubspec.yaml \
              android/app/src/main/AndroidManifest.xml \
              ios/Runner/Info.plist
          } || true)"

          if [[ -n "$violations" ]]; then
            echo "::error title=Paiement Stripe natif interdit::La livraison mobile doit utiliser les achats intégrés des stores."
            echo "$violations"
            exit 1
          fi

      - name: Vérifier le format du code et des tests
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyser l'application et les tests
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Exécuter les tests avec la configuration staging
        run: >-
          flutter test --reporter expanded
          --dart-define=APP_ENVIRONMENT=${{ env.STAGING_APP_ENVIRONMENT }}
          --dart-define=API_BASE_URL=${{ env.STAGING_API_BASE_URL }}

  backend-store-billing-quality:
    name: Backend Store Billing vérifié
    needs: staging-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "18.19.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend verrouillées
        run: npm ci --prefix backend

      - name: Vérifier la syntaxe du backend Store Billing
        run: |
          node --check backend/http-functions.js
          node --check backend/security-core.js
          node --check backend/store-purchase-core.js
          node --check backend/store-purchase-service.js
          node --check backend/store-purchase-verifiers.js
          node --check backend/store-notification-core.js
          node --check backend/store-notification-service.js

      - name: Auditer les dépendances backend de production
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Tester le backend Store Billing
        run: npm test --prefix backend

  signed-ipa:
    name: IPA staging App Store signée
    if: github.ref == 'refs/heads/candidate/store-billing-entitlements-2026-09-28'
    needs:
      - staging-contract
      - release-quality
      - backend-store-billing-quality
    runs-on: macos-26
    environment: mobile-staging
    timeout-minutes: 45
    env:
      EXPECTED_TEAM_ID: K94TPPGBZS
      EXPECTED_BUNDLE_ID: ca.indexcanada.app
      EXPECTED_PROFILE_NAME: Index Canada – App Store (Release 2026-2027)
      EXPECTED_PROFILE_UUID: a22db0d2-5f08-4dfb-84ff-49b4d9706451

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Revalider le contrat staging avant signature
        shell: bash
        run: |
          set -euo pipefail

          version_value="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
          expected_version="$EXPECTED_VERSION_NAME+$EXPECTED_BUILD_NUMBER"
          if [[ "$GITHUB_REF" != "$EXPECTED_SOURCE_REF" || \
                -z "$MOBILE_STAGING_APPROVED_SHA" || \
                ! "$MOBILE_STAGING_APPROVED_SHA" =~ ^[0-9a-f]{40}$ || \
                "$MOBILE_STAGING_APPROVED_SHA" != "$GITHUB_SHA" || \
                "$version_value" != "$expected_version" || \
                "$STAGING_APP_ENVIRONMENT" != "staging" || \
                "$STAGING_API_BASE_URL" != "https://immigrantindex.wixsite.com/website-1/_functions" || \
                "$STAGING_API_BASE_URL" == "$FORBIDDEN_PRODUCTION_API_BASE_URL" || \
                "$STAGING_API_BASE_URL" == "$FORBIDDEN_CI_API_BASE_URL" ]]; then
            echo "::error title=Contrat staging altéré::Branche, version, environnement et URL doivent rester ceux validés par le gate."
            exit 1
          fi

      - name: Installer CocoaPods 1.17.0
        shell: bash
        run: |
          set -euo pipefail

          if ! gem list --local --installed cocoapods --version 1.17.0; then
            sudo gem install cocoapods --version 1.17.0 --no-document
          fi

          pod_version="$(pod --version)"
          if [[ "$pod_version" != "1.17.0" ]]; then
            echo "::error title=Version CocoaPods inattendue::CocoaPods 1.17.0 est requis, version détectée : $pod_version."
            exit 1
          fi

      - name: Vérifier Xcode 26 et le SDK iOS 26
        shell: bash
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"

          uname -m
          xcode-select -p
          echo "Xcode $xcode_version"
          echo "SDK iOS $ios_sdk_version"
          pod --version

          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "::error title=Xcode trop ancien::Xcode 26 ou ultérieur est requis."
            exit 1
          fi
          if [[ ! "$ios_sdk_major" =~ ^[0-9]+$ ]] || (( ios_sdk_major < 26 )); then
            echo "::error title=SDK iOS trop ancien::Le SDK iOS 26 ou ultérieur est requis."
            exit 1
          fi

      - name: Vérifier les secrets de livraison
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.IOS_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_APP_STORE_PROFILE_BASE64 \
            IOS_ARTIFACT_ENCRYPTION_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Secret manquant::$secret_name n'est pas configuré."
              exit 1
            fi
          done

          if (( ${#IOS_ARTIFACT_ENCRYPTION_PASSWORD} < 32 )); then
            echo "::error title=Secret de chiffrement invalide::Le mot de passe de l'artefact doit contenir au moins 32 caractères."
            exit 1
          fi

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Préparer la signature Apple éphémère
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/index-canada-distribution.p12"
          profile_path="$RUNNER_TEMP/index-canada.mobileprovision"
          profile_plist="$RUNNER_TEMP/index-canada-profile.plist"
          keychain_path="$RUNNER_TEMP/index-canada-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          values = (
              ("IOS_DISTRIBUTION_P12_BASE64", "index-canada-distribution.p12"),
              ("IOS_APP_STORE_PROFILE_BASE64", "index-canada.mobileprovision"),
          )
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          for environment_name, filename in values:
              encoded = os.environ[environment_name]
              runner_temp.joinpath(filename).write_bytes(
                  base64.b64decode("".join(encoded.split()), validate=True)
              )
          PY

          chmod 600 "$certificate_path" "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"

          if [[ "$profile_name" != "$EXPECTED_PROFILE_NAME" ]]; then
            echo "::error title=Profil inattendu::Le nom du profil ne correspond pas à la livraison."
            exit 1
          fi
          if [[ "$profile_uuid" != "$EXPECTED_PROFILE_UUID" ]]; then
            echo "::error title=Profil inattendu::L'UUID du profil ne correspond pas à la livraison."
            exit 1
          fi
          if [[ "$profile_team" != "$EXPECTED_TEAM_ID" ]]; then
            echo "::error title=Équipe inattendue::Le profil appartient à une autre équipe Apple."
            exit 1
          fi
          if [[ "$profile_app_id" != "$EXPECTED_TEAM_ID.$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error title=App ID inattendu::Le profil appartient à une autre application."
            exit 1
          fi
          if [[ "$get_task_allow" != "false" ]] || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1 || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "::error title=Type de profil inattendu::Un profil App Store de distribution est requis."
            exit 1
          fi

          PROFILE_PLIST="$profile_plist" python3 - <<'PY'
          import datetime as dt
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as source:
              profile = plistlib.load(source)
          expiration = profile["ExpirationDate"]
          if expiration <= dt.datetime.utcnow():
              raise SystemExit("Le profil de provisionnement Apple est expiré.")
          print(f"Profil valide jusqu'au {expiration.isoformat()}Z")
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          if ! grep -Fq "Apple Distribution: Immigrant Index Inc. ($EXPECTED_TEAM_ID)" <<< "$identity_output"; then
            echo "::error title=Identité absente::Le P12 ne contient pas l'identité Apple Distribution attendue."
            exit 1
          fi

          security find-certificate \
            -c "Apple Distribution: Immigrant Index Inc. ($EXPECTED_TEAM_ID)" \
            -p "$keychain_path" > "$RUNNER_TEMP/distribution-from-keychain.pem"
          certificate_sha="$(openssl x509 \
            -in "$RUNNER_TEMP/distribution-from-keychain.pem" \
            -outform DER | shasum -a 256 | awk '{print $1}')"
          PROFILE_PLIST="$profile_plist" CERTIFICATE_SHA="$certificate_sha" python3 - <<'PY'
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as source:
              profile = plistlib.load(source)
          certificate_hashes = {
              hashlib.sha256(certificate).hexdigest()
              for certificate in profile["DeveloperCertificates"]
          }
          if os.environ["CERTIFICATE_SHA"] not in certificate_hashes:
              raise SystemExit(
                  "Le profil ne contient pas le certificat Apple Distribution importé."
              )
          PY

          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_directory"
          installed_profile="$profiles_directory/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile"

          {
            echo "keychain_path=$keychain_path"
            echo "installed_profile=$installed_profile"
            echo "profile_uuid=$profile_uuid"
          } >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Vérifier le manifeste des plugins iOS
        shell: bash
        run: |
          set -euo pipefail

          manifest=.flutter-plugins-dependencies
          if [[ ! -s "$manifest" ]]; then
            echo "::error title=Manifeste Flutter absent::$manifest n'a pas été généré."
            exit 1
          fi

          if ! jq -e '.swift_package_manager_enabled.ios == true' "$manifest" >/dev/null; then
            echo "::error title=SwiftPM iOS désactivé::Flutter 3.47.4 doit générer swift_package_manager_enabled.ios=true."
            jq '{version, swift_package_manager_enabled}' "$manifest"
            exit 1
          fi

          if ! jq -e '.plugins.ios | any(.name == "in_app_purchase_storekit" and .native_build == true)' "$manifest" >/dev/null; then
            echo "::error title=Plugin StoreKit absent::in_app_purchase_storekit doit être un plugin iOS natif."
            jq '[.plugins.ios[] | {name, native_build}]' "$manifest"
            exit 1
          fi

      - name: Vérifier la migration SwiftPM versionnée
        shell: bash
        run: |
          set -euo pipefail

          project_file=ios/Runner.xcodeproj/project.pbxproj
          scheme_file=ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          if ! grep -Fq 'FlutterGeneratedPluginSwiftPackage' "$project_file"; then
            echo "::error title=Projet SwiftPM non migré::FlutterGeneratedPluginSwiftPackage est absent du projet Xcode versionné."
            exit 1
          fi
          if ! grep -Fq 'xcode_backend.sh' "$scheme_file"; then
            echo "::error title=Schéma SwiftPM non migré::Le script de préparation Flutter est absent du schéma Runner versionné."
            exit 1
          fi

      - name: Vérifier les dépendances CocoaPods verrouillées
        working-directory: ios
        run: pod install --deployment

      - name: Vérifier la cohérence des fichiers iOS
        shell: bash
        run: |
          set -euo pipefail

          ios_dependency_files=(
            ios/Podfile.lock
            ios/Runner.xcodeproj/project.pbxproj
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          )
          if ! git diff --quiet HEAD -- "${ios_dependency_files[@]}"; then
            git diff HEAD -- "${ios_dependency_files[@]}"
            echo "::error title=Dépendances iOS modifiées::La livraison est en vérification stricte; lockfile, projet et schéma doivent rester intacts."
            exit 1
          fi

      - name: Compiler l'IPA staging
        run: >-
          flutter build ipa --release
          --no-pub
          --export-options-plist=ios/exportOptions.plist
          --build-name=${{ env.EXPECTED_VERSION_NAME }}
          --build-number=${{ env.EXPECTED_BUILD_NUMBER }}
          --dart-define=APP_ENVIRONMENT=${{ env.STAGING_APP_ENVIRONMENT }}
          --dart-define=API_BASE_URL=${{ env.STAGING_API_BASE_URL }}

      - name: Vérifier la propreté iOS après compilation
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet HEAD -- ios; then
            git diff --stat HEAD -- ios
            echo "::error title=Projet iOS modifié::La compilation staging ne doit générer ni lockfile ni migration non versionnée."
            exit 1
          fi

      - name: Vérifier l'IPA staging signée
        id: ipa
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} != 1 )); then
            echo "::error title=IPA ambiguë::Une seule IPA est attendue."
            exit 1
          fi
          ipa_path="${ipa_files[0]}"
          unzip -tq "$ipa_path"

          extracted="$RUNNER_TEMP/verified-staging-ipa"
          mkdir -p "$extracted"
          unzip -q "$ipa_path" -d "$extracted"
          app_files=("$extracted"/Payload/*.app)
          if (( ${#app_files[@]} != 1 )); then
            echo "::error title=Bundle ambigu::Une seule application est attendue."
            exit 1
          fi
          app_path="${app_files[0]}"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app_path/Info.plist")"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_path/Info.plist")"
          build="$(plutil -extract CFBundleVersion raw -o - "$app_path/Info.plist")"
          xcode_build="$(plutil -extract DTXcode raw -o - "$app_path/Info.plist")"
          sdk_name="$(plutil -extract DTSDKName raw -o - "$app_path/Info.plist")"
          platform_version="$(plutil -extract DTPlatformVersion raw -o - "$app_path/Info.plist")"
          minimum_os_version="$(plutil -extract MinimumOSVersion raw -o - "$app_path/Info.plist")"

          if [[ "$bundle_id" != "$EXPECTED_BUNDLE_ID" || \
                "$version" != "$EXPECTED_VERSION_NAME" || \
                "$build" != "$EXPECTED_BUILD_NUMBER" ]]; then
            echo "::error title=Identité IPA staging inattendue::Bundle, version ou build ne correspond pas à $EXPECTED_VERSION_NAME+$EXPECTED_BUILD_NUMBER."
            exit 1
          fi

          if [[ ! "$xcode_build" =~ ^[0-9]+$ ]] || (( 10#$xcode_build < 2600 )); then
            echo "::error title=Toolchain IPA trop ancienne::L'IPA doit être compilée avec Xcode 26 ou ultérieur."
            exit 1
          fi
          if [[ ! "$sdk_name" =~ ^iphoneos([0-9]+)(\..*)?$ ]]; then
            echo "::error title=SDK IPA invalide::Le SDK de l'IPA est illisible."
            exit 1
          fi
          sdk_major="${BASH_REMATCH[1]}"
          platform_major="${platform_version%%.*}"
          if (( sdk_major < 26 )) || [[ ! "$platform_major" =~ ^[0-9]+$ ]] || (( platform_major < 26 )); then
            echo "::error title=SDK IPA trop ancien::L'IPA doit utiliser le SDK iOS 26 ou ultérieur."
            exit 1
          fi
          if [[ "$minimum_os_version" != "15.0" ]]; then
            echo "::error title=Cible iOS inattendue::La version minimale doit rester iOS 15.0."
            exit 1
          fi

          executable="$(plutil -extract CFBundleExecutable raw -o - "$app_path/Info.plist")"
          runner_binary="$app_path/$executable"
          dart_app_binary="$app_path/Frameworks/App.framework/App"
          compiled_strings="$RUNNER_TEMP/compiled-staging-strings.txt"
          if [[ ! -s "$runner_binary" || ! -s "$dart_app_binary" ]]; then
            echo "::error title=Binaire IPA incomplet::Runner et App.framework doivent être présents avant de vérifier la configuration compilée."
            exit 1
          fi

          {
            xcrun strings -a "$runner_binary"
            xcrun strings -a "$dart_app_binary"
          } > "$compiled_strings"
          if ! grep -Fq "$STAGING_API_BASE_URL" "$compiled_strings"; then
            echo "::error title=URL staging absente::Les binaires compilés ne contiennent pas l'URL Wix de préproduction attendue."
            exit 1
          fi
          for forbidden_url in \
            "$FORBIDDEN_PRODUCTION_API_BASE_URL" \
            "$FORBIDDEN_CI_API_BASE_URL"; do
            if grep -Fq "$forbidden_url" "$compiled_strings"; then
              echo "::error title=URL interdite compilée::Les binaires staging contiennent une URL production ou CI."
              exit 1
            fi
          done

          embedded_secret_files="$({
            grep -aRIlE \
              '(sk_(live|test)_[[:alnum:]]{16,}|rk_(live|test)_[[:alnum:]]{16,}|whsec_[[:alnum:]]{16,}|AIza[[:alnum:]_-]{30,}|AKIA[0-9A-Z]{16}|gh[pousr]_[[:alnum:]]{20,}|-----BEGIN ((RSA|EC|OPENSSH) )?PRIVATE KEY-----)' \
              "$extracted"
          } || true)"
          if [[ -n "$embedded_secret_files" ]]; then
            echo "::error title=Secret potentiel dans l'IPA::Le contenu sensible n'est jamais affiché; seuls les fichiers concernés suivent."
            printf '%s\n' "$embedded_secret_files"
            exit 1
          fi

          vtool_output="$(xcrun vtool -show-build "$runner_binary")"
          binary_sdk="$(awk '$1 == "sdk" { print $2; exit }' <<< "$vtool_output")"
          binary_sdk_major="${binary_sdk%%.*}"
          echo "$vtool_output"
          if [[ ! "$binary_sdk_major" =~ ^[0-9]+$ ]] || (( binary_sdk_major < 26 )); then
            echo "::error title=SDK binaire trop ancien::Le binaire doit utiliser le SDK iOS 26 ou ultérieur."
            exit 1
          fi

          echo "Métadonnées IPA staging : Xcode $xcode_build, $sdk_name, plateforme $platform_version, minimum iOS $minimum_os_version."

          codesign -dv --verbose=4 "$app_path" 2> "$RUNNER_TEMP/codesign-details.txt"
          if ! grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"; then
            echo "::error title=Équipe IPA inattendue::La signature n'appartient pas à l'équipe prévue."
            exit 1
          fi

          security cms -D -i "$app_path/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          embedded_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded-profile.plist")"
          if [[ "$embedded_name" != "$EXPECTED_PROFILE_NAME" || \
                "$embedded_uuid" != "${{ steps.signing.outputs.profile_uuid }}" || \
                "$embedded_team" != "$EXPECTED_TEAM_ID" || \
                "$embedded_app_id" != "$EXPECTED_TEAM_ID.$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error title=Profil IPA inattendu::L'IPA n'embarque pas le profil App Store complet prévu."
            exit 1
          fi

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Chiffrer l'IPA staging avant archivage
        id: encrypted_ipa
        shell: bash
        env:
          IOS_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.IOS_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          encrypted_path="${{ steps.ipa.outputs.ipa_path }}.enc"
          encryption_complete=false
          trap 'if [[ "$encryption_complete" != "true" ]]; then rm -f "$encrypted_path"; fi' EXIT
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "${{ steps.ipa.outputs.ipa_path }}" \
            -out "$encrypted_path" \
            -pass env:IOS_ARTIFACT_ENCRYPTION_PASSWORD
          test -s "$encrypted_path"
          roundtrip_path="$RUNNER_TEMP/index-canada-staging-roundtrip.ipa"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_path" \
            -out "$roundtrip_path" \
            -pass env:IOS_ARTIFACT_ENCRYPTION_PASSWORD
          cmp -s "${{ steps.ipa.outputs.ipa_path }}" "$roundtrip_path"
          rm -f "$roundtrip_path"
          echo "encrypted_path=$encrypted_path" >> "$GITHUB_OUTPUT"
          encryption_complete=true
          trap - EXIT

      - name: Publier l'IPA staging vérifiée et chiffrée
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-canada-ios-staging-${{ env.EXPECTED_VERSION_NAME }}-${{ env.EXPECTED_BUILD_NUMBER }}-encrypted
          path: ${{ steps.encrypted_ipa.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Valider auprès d'Apple et envoyer le staging vers TestFlight
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          if [[ "$GITHUB_REF" != "$EXPECTED_SOURCE_REF" || \
                "$STAGING_APP_ENVIRONMENT" != "staging" || \
                "$STAGING_API_BASE_URL" != "https://immigrantindex.wixsite.com/website-1/_functions" ]]; then
            echo "::error title=Envoi TestFlight interdit::Le contrat staging n'est plus exact."
            exit 1
          fi

          for secret_name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_BASE64; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Secret App Store Connect manquant::$secret_name n'est pas configuré."
              exit 1
            fi
          done

          if [[ ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Identifiant de clé invalide::ASC_KEY_ID doit contenir 10 caractères alphanumériques majuscules."
            exit 1
          fi
          if [[ ! "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Issuer ID invalide::ASC_ISSUER_ID doit être un UUID."
            exit 1
          fi
          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error title=IPA absente::Le fichier staging vérifié à envoyer est introuvable."
            exit 1
          fi

          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          trap 'rm -f "$key_path"; rmdir "$key_directory" 2>/dev/null || true' EXIT

          ASC_KEY_PATH="$key_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["ASC_PRIVATE_KEY_P8_BASE64"].split())
          Path(os.environ["ASC_KEY_PATH"]).write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY

          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -noout >/dev/null
          xcrun --find altool >/dev/null
          xcodebuild -version

          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Nettoyer la signature temporaire
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set +e
          installed_profile="${{ steps.signing.outputs.installed_profile }}"
          if [[ -z "$installed_profile" && -f "$RUNNER_TEMP/index-canada-profile.plist" ]]; then
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/index-canada-profile.plist" 2>/dev/null)"
            if [[ -n "$profile_uuid" ]]; then
              installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          fi
          if [[ -n "$installed_profile" ]]; then
            rm -f "$installed_profile"
          fi
          security list-keychains -d user -s \
            "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain \
            "$RUNNER_TEMP/index-canada-signing.keychain-db" 2>/dev/null
          if [[ -n "$ASC_KEY_ID" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rmdir "$HOME/.appstoreconnect/private_keys" 2>/dev/null
          fi
          rm -f \
            "$RUNNER_TEMP/index-canada-distribution.p12" \
            "$RUNNER_TEMP/index-canada.mobileprovision" \
            "$RUNNER_TEMP/index-canada-profile.plist" \
            "$RUNNER_TEMP/distribution-from-keychain.pem" \
            "$RUNNER_TEMP/codesign-details.txt" \
            "$RUNNER_TEMP/compiled-staging-strings.txt" \
            "$RUNNER_TEMP/embedded-profile.plist" \
            "$RUNNER_TEMP/index-canada-staging-roundtrip.ipa"
          rm -rf "$RUNNER_TEMP/verified-staging-ipa"
          if [[ -n "${{ steps.ipa.outputs.ipa_path }}" ]]; then
            rm -f \
              "${{ steps.ipa.outputs.ipa_path }}" \
              "${{ steps.ipa.outputs.ipa_path }}.enc"
          fi
          if [[ -n "${{ steps.encrypted_ipa.outputs.encrypted_path }}" ]]; then
            rm -f "${{ steps.encrypted_ipa.outputs.encrypted_path }}"
