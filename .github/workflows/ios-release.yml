name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Envoyer l'IPA vérifiée vers TestFlight
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-ipa:
    name: IPA App Store signée
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPECTED_TEAM_ID: K94TPPGBZS
      EXPECTED_BUNDLE_ID: ca.indexcanada.app
      EXPECTED_PROFILE_NAME: Index Canada – App Store (Release 2026-2027)
      EXPECTED_PROFILE_UUID: a22db0d2-5f08-4dfb-84ff-49b4d9706451

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Vérifier Xcode 26 et le SDK iOS 26
        shell: bash
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"

          uname -m
          xcode-select -p
          echo "Xcode $xcode_version"
          echo "SDK iOS $ios_sdk_version"
          pod --version

          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "::error title=Xcode trop ancien::Xcode 26 ou ultérieur est requis."
            exit 1
          fi
          if [[ ! "$ios_sdk_major" =~ ^[0-9]+$ ]] || (( ios_sdk_major < 26 )); then
            echo "::error title=SDK iOS trop ancien::Le SDK iOS 26 ou ultérieur est requis."
            exit 1
          fi

      - name: Vérifier les secrets de livraison
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_STRIPE_PUBLISHABLE_KEY: ${{ secrets.IOS_STRIPE_PUBLISHABLE_KEY }}
          IOS_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.IOS_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            IOS_DISTRIBUTION_P12_BASE64 \
            IOS_DISTRIBUTION_P12_PASSWORD \
            IOS_APP_STORE_PROFILE_BASE64 \
            IOS_STRIPE_PUBLISHABLE_KEY \
            IOS_ARTIFACT_ENCRYPTION_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Secret manquant::$secret_name n'est pas configuré."
              exit 1
            fi
          done

          if [[ ! "$IOS_STRIPE_PUBLISHABLE_KEY" =~ ^pk_live_[A-Za-z0-9]{16,}$ ]]; then
            echo "::error title=Clé Stripe invalide::La livraison iOS exige une clé publique pk_live_."
            exit 1
          fi
          if (( ${#IOS_ARTIFACT_ENCRYPTION_PASSWORD} < 32 )); then
            echo "::error title=Secret de chiffrement invalide::Le mot de passe de l'artefact doit contenir au moins 32 caractères."
            exit 1
          fi

      - name: Installer Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Préparer la signature Apple éphémère
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/index-canada-distribution.p12"
          profile_path="$RUNNER_TEMP/index-canada.mobileprovision"
          profile_plist="$RUNNER_TEMP/index-canada-profile.plist"
          keychain_path="$RUNNER_TEMP/index-canada-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          values = (
              ("IOS_DISTRIBUTION_P12_BASE64", "index-canada-distribution.p12"),
              ("IOS_APP_STORE_PROFILE_BASE64", "index-canada.mobileprovision"),
          )
          runner_temp = Path(os.environ["RUNNER_TEMP"])
          for environment_name, filename in values:
              encoded = os.environ[environment_name]
              runner_temp.joinpath(filename).write_bytes(
                  base64.b64decode("".join(encoded.split()), validate=True)
              )
          PY

          chmod 600 "$certificate_path" "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"

          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist")"
          profile_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          profile_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          get_task_allow="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$profile_plist")"

          if [[ "$profile_name" != "$EXPECTED_PROFILE_NAME" ]]; then
            echo "::error title=Profil inattendu::Le nom du profil ne correspond pas à la livraison."
            exit 1
          fi
          if [[ "$profile_uuid" != "$EXPECTED_PROFILE_UUID" ]]; then
            echo "::error title=Profil inattendu::L'UUID du profil ne correspond pas à la livraison."
            exit 1
          fi
          if [[ "$profile_team" != "$EXPECTED_TEAM_ID" ]]; then
            echo "::error title=Équipe inattendue::Le profil appartient à une autre équipe Apple."
            exit 1
          fi
          if [[ "$profile_app_id" != "$EXPECTED_TEAM_ID.$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error title=App ID inattendu::Le profil appartient à une autre application."
            exit 1
          fi
          if [[ "$get_task_allow" != "false" ]] || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$profile_plist" >/dev/null 2>&1 || \
             /usr/libexec/PlistBuddy -c 'Print :ProvisionsAllDevices' "$profile_plist" >/dev/null 2>&1; then
            echo "::error title=Type de profil inattendu::Un profil App Store de distribution est requis."
            exit 1
          fi

          PROFILE_PLIST="$profile_plist" python3 - <<'PY'
          import datetime as dt
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as source:
              profile = plistlib.load(source)
          expiration = profile["ExpirationDate"]
          if expiration <= dt.datetime.utcnow():
              raise SystemExit("Le profil de provisionnement Apple est expiré.")
          print(f"Profil valide jusqu'au {expiration.isoformat()}Z")
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_DISTRIBUTION_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          if ! grep -Fq "Apple Distribution: Immigrant Index Inc. ($EXPECTED_TEAM_ID)" <<< "$identity_output"; then
            echo "::error title=Identité absente::Le P12 ne contient pas l'identité Apple Distribution attendue."
            exit 1
          fi

          security find-certificate \
            -c "Apple Distribution: Immigrant Index Inc. ($EXPECTED_TEAM_ID)" \
            -p "$keychain_path" > "$RUNNER_TEMP/distribution-from-keychain.pem"
          certificate_sha="$(openssl x509 \
            -in "$RUNNER_TEMP/distribution-from-keychain.pem" \
            -outform DER | shasum -a 256 | awk '{print $1}')"
          PROFILE_PLIST="$profile_plist" CERTIFICATE_SHA="$certificate_sha" python3 - <<'PY'
          import hashlib
          import os
          import plistlib

          with open(os.environ["PROFILE_PLIST"], "rb") as source:
              profile = plistlib.load(source)
          certificate_hashes = {
              hashlib.sha256(certificate).hexdigest()
              for certificate in profile["DeveloperCertificates"]
          }
          if os.environ["CERTIFICATE_SHA"] not in certificate_hashes:
              raise SystemExit(
                  "Le profil ne contient pas le certificat Apple Distribution importé."
              )
          PY

          profiles_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles_directory"
          installed_profile="$profiles_directory/$profile_uuid.mobileprovision"
          cp "$profile_path" "$installed_profile"

          {
            echo "keychain_path=$keychain_path"
            echo "installed_profile=$installed_profile"
            echo "profile_uuid=$profile_uuid"
          } >> "$GITHUB_OUTPUT"

      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Synchroniser les dépendances CocoaPods
        working-directory: ios
        run: pod install

      - name: Vérifier la cohérence du lockfile iOS
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- ios/Podfile.lock; then
            git diff -- ios/Podfile.lock
            echo "::error title=Podfile.lock modifié::Le lockfile iOS doit rester reproductible."
            exit 1
          fi

      - name: Compiler l'IPA App Store
        env:
          IOS_STRIPE_PUBLISHABLE_KEY: ${{ secrets.IOS_STRIPE_PUBLISHABLE_KEY }}
        run: >-
          flutter build ipa --release
          --export-options-plist=ios/exportOptions.plist
          --dart-define=APP_ENVIRONMENT=production
          --dart-define=API_BASE_URL=https://www.immigrantindex.com/_functions
          --dart-define=STRIPE_PUBLISHABLE_KEY=$IOS_STRIPE_PUBLISHABLE_KEY

      - name: Vérifier l'IPA signée
        id: ipa
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if (( ${#ipa_files[@]} != 1 )); then
            echo "::error title=IPA ambiguë::Une seule IPA est attendue."
            exit 1
          fi
          ipa_path="${ipa_files[0]}"
          unzip -tq "$ipa_path"

          extracted="$RUNNER_TEMP/verified-ipa"
          mkdir -p "$extracted"
          unzip -q "$ipa_path" -d "$extracted"
          app_files=("$extracted"/Payload/*.app)
          if (( ${#app_files[@]} != 1 )); then
            echo "::error title=Bundle ambigu::Une seule application est attendue."
            exit 1
          fi
          app_path="${app_files[0]}"

          codesign --verify --deep --strict --verbose=2 "$app_path"
          bundle_id="$(plutil -extract CFBundleIdentifier raw -o - "$app_path/Info.plist")"
          version="$(plutil -extract CFBundleShortVersionString raw -o - "$app_path/Info.plist")"
          build="$(plutil -extract CFBundleVersion raw -o - "$app_path/Info.plist")"
          xcode_build="$(plutil -extract DTXcode raw -o - "$app_path/Info.plist")"
          sdk_name="$(plutil -extract DTSDKName raw -o - "$app_path/Info.plist")"
          platform_version="$(plutil -extract DTPlatformVersion raw -o - "$app_path/Info.plist")"
          minimum_os_version="$(plutil -extract MinimumOSVersion raw -o - "$app_path/Info.plist")"

          if [[ "$bundle_id" != "$EXPECTED_BUNDLE_ID" || "$version" != "1.1.0" || "$build" != "25" ]]; then
            echo "::error title=Identité IPA inattendue::Bundle, version ou build ne correspond pas à 1.1.0 (25)."
            exit 1
          fi

          if [[ ! "$xcode_build" =~ ^[0-9]+$ ]] || (( 10#$xcode_build < 2600 )); then
            echo "::error title=Toolchain IPA trop ancienne::L'IPA doit être compilée avec Xcode 26 ou ultérieur."
            exit 1
          fi
          if [[ ! "$sdk_name" =~ ^iphoneos([0-9]+)(\..*)?$ ]]; then
            echo "::error title=SDK IPA invalide::Le SDK de l'IPA est illisible."
            exit 1
          fi
          sdk_major="${BASH_REMATCH[1]}"
          platform_major="${platform_version%%.*}"
          if (( sdk_major < 26 )) || [[ ! "$platform_major" =~ ^[0-9]+$ ]] || (( platform_major < 26 )); then
            echo "::error title=SDK IPA trop ancien::L'IPA doit utiliser le SDK iOS 26 ou ultérieur."
            exit 1
          fi
          if [[ "$minimum_os_version" != "15.0" ]]; then
            echo "::error title=Cible iOS inattendue::La version minimale doit rester iOS 15.0."
            exit 1
          fi

          executable="$(plutil -extract CFBundleExecutable raw -o - "$app_path/Info.plist")"
          vtool_output="$(xcrun vtool -show-build "$app_path/$executable")"
          binary_sdk="$(awk '$1 == "sdk" { print $2; exit }' <<< "$vtool_output")"
          binary_sdk_major="${binary_sdk%%.*}"
          echo "$vtool_output"
          if [[ ! "$binary_sdk_major" =~ ^[0-9]+$ ]] || (( binary_sdk_major < 26 )); then
            echo "::error title=SDK binaire trop ancien::Le binaire doit utiliser le SDK iOS 26 ou ultérieur."
            exit 1
          fi

          echo "Métadonnées IPA : Xcode $xcode_build, $sdk_name, plateforme $platform_version, minimum iOS $minimum_os_version."

          codesign -dv --verbose=4 "$app_path" 2> "$RUNNER_TEMP/codesign-details.txt"
          if ! grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID" "$RUNNER_TEMP/codesign-details.txt"; then
            echo "::error title=Équipe IPA inattendue::La signature n'appartient pas à l'équipe prévue."
            exit 1
          fi

          security cms -D -i "$app_path/embedded.mobileprovision" > "$RUNNER_TEMP/embedded-profile.plist"
          embedded_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/embedded-profile.plist")"
          embedded_app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/embedded-profile.plist")"
          if [[ "$embedded_name" != "$EXPECTED_PROFILE_NAME" || \
                "$embedded_uuid" != "${{ steps.signing.outputs.profile_uuid }}" || \
                "$embedded_team" != "$EXPECTED_TEAM_ID" || \
                "$embedded_app_id" != "$EXPECTED_TEAM_ID.$EXPECTED_BUNDLE_ID" ]]; then
            echo "::error title=Profil IPA inattendu::L'IPA n'embarque pas le profil de production complet prévu."
            exit 1
          fi

          echo "ipa_path=$ipa_path" >> "$GITHUB_OUTPUT"

      - name: Chiffrer l'IPA avant archivage
        id: encrypted_ipa
        shell: bash
        env:
          IOS_ARTIFACT_ENCRYPTION_PASSWORD: ${{ secrets.IOS_ARTIFACT_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail
          encrypted_path="${{ steps.ipa.outputs.ipa_path }}.enc"
          encryption_complete=false
          trap 'if [[ "$encryption_complete" != "true" ]]; then rm -f "$encrypted_path"; fi' EXIT
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in "${{ steps.ipa.outputs.ipa_path }}" \
            -out "$encrypted_path" \
            -pass env:IOS_ARTIFACT_ENCRYPTION_PASSWORD
          test -s "$encrypted_path"
          roundtrip_path="$RUNNER_TEMP/index-canada-roundtrip.ipa"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$encrypted_path" \
            -out "$roundtrip_path" \
            -pass env:IOS_ARTIFACT_ENCRYPTION_PASSWORD
          cmp -s "${{ steps.ipa.outputs.ipa_path }}" "$roundtrip_path"
          rm -f "$roundtrip_path"
          echo "encrypted_path=$encrypted_path" >> "$GITHUB_OUTPUT"
          encryption_complete=true
          trap - EXIT

      - name: Publier l'IPA vérifiée et chiffrée
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-canada-ios-1.1.0-25-encrypted
          path: ${{ steps.encrypted_ipa.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Valider auprès d'Apple et envoyer vers TestFlight
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          IPA_PATH: ${{ steps.ipa.outputs.ipa_path }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          for secret_name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8_BASE64; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error title=Secret App Store Connect manquant::$secret_name n'est pas configuré."
              exit 1
            fi
          done

          if [[ ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error title=Identifiant de clé invalide::ASC_KEY_ID doit contenir 10 caractères alphanumériques majuscules."
            exit 1
          fi
          if [[ ! "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error title=Issuer ID invalide::ASC_ISSUER_ID doit être un UUID."
            exit 1
          fi
          if [[ ! -s "$IPA_PATH" ]]; then
            echo "::error title=IPA absente::Le fichier vérifié à envoyer est introuvable."
            exit 1
          fi

          key_directory="$HOME/.appstoreconnect/private_keys"
          key_path="$key_directory/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          trap 'rm -f "$key_path"; rmdir "$key_directory" 2>/dev/null || true' EXIT

          ASC_KEY_PATH="$key_path" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = "".join(os.environ["ASC_PRIVATE_KEY_P8_BASE64"].split())
          Path(os.environ["ASC_KEY_PATH"]).write_bytes(
              base64.b64decode(encoded, validate=True)
          )
          PY

          chmod 600 "$key_path"
          openssl pkey -in "$key_path" -noout >/dev/null
          xcrun --find altool >/dev/null
          xcodebuild -version

          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Nettoyer la signature temporaire
        if: always()
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set +e
          installed_profile="${{ steps.signing.outputs.installed_profile }}"
          if [[ -z "$installed_profile" && -f "$RUNNER_TEMP/index-canada-profile.plist" ]]; then
            profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/index-canada-profile.plist" 2>/dev/null)"
            if [[ -n "$profile_uuid" ]]; then
              installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
            fi
          fi
          if [[ -n "$installed_profile" ]]; then
            rm -f "$installed_profile"
          fi
          security list-keychains -d user -s \
            "$HOME/Library/Keychains/login.keychain-db"
          security delete-keychain \
            "$RUNNER_TEMP/index-canada-signing.keychain-db" 2>/dev/null
          if [[ -n "$ASC_KEY_ID" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            rmdir "$HOME/.appstoreconnect/private_keys" 2>/dev/null
          fi
          rm -f \
            "$RUNNER_TEMP/index-canada-distribution.p12" \
            "$RUNNER_TEMP/index-canada.mobileprovision" \
            "$RUNNER_TEMP/index-canada-profile.plist" \
            "$RUNNER_TEMP/distribution-from-keychain.pem" \
            "$RUNNER_TEMP/codesign-details.txt" \
            "$RUNNER_TEMP/embedded-profile.plist" \
            "$RUNNER_TEMP/index-canada-roundtrip.ipa"
          rm -rf "$RUNNER_TEMP/verified-ipa"
          if [[ -n "${{ steps.ipa.outputs.ipa_path }}" ]]; then
            rm -f \
              "${{ steps.ipa.outputs.ipa_path }}" \
              "${{ steps.ipa.outputs.ipa_path }}.enc"
          fi
          if [[ -n "${{ steps.encrypted_ipa.outputs.encrypted_path }}" ]]; then
            rm -f "${{ steps.encrypted_ipa.outputs.encrypted_path }}"
          fi
