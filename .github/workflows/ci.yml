name: Flutter CI

on:
  push:
    branches:
      - main
      - "candidate/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Sécurité, médias et pagination du backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          # Reproduit le plancher du runtime backend/Wix déclaré dans
          # backend/package.json; un test sous Node 22 masquerait une rupture.
          node-version: "18.19.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances backend verrouillées
        run: npm ci --prefix backend

      - name: Vérifier la syntaxe des modules backend
        run: |
          node --check backend/http-functions.js
          node --check backend/security-core.js
          node --check backend/directory-pagination.js
          node --check backend/store-purchase-core.js
          node --check backend/store-purchase-service.js
          node --check backend/store-purchase-verifiers.js
          node --check backend/store-notification-core.js
          node --check backend/store-notification-service.js

      - name: Auditer les dépendances backend de production
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Tester le backend
        run: npm test --prefix backend

  quality:
    name: Format, analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Vérifier les fichiers sensibles suivis
        shell: bash
        run: |
          set -euo pipefail

          sensitive_files="$({
            git ls-files \
              | grep -E '(^|/)(\.env($|\.)|key\.properties$|service-account[^/]*\.json$|[^/]+\.(jks|keystore|p8|p12|pfx|pem|key|mobileprovision|provisionprofile)$)' \
              | grep -Ev '(\.example|\.sample|\.template)$'
          } || true)"

          if [[ -n "$sensitive_files" ]]; then
            echo "Fichiers potentiellement sensibles suivis par Git :"
            echo "$sensitive_files"
            exit 1
          fi

      - name: Rechercher des motifs de secrets connus
        shell: bash
        run: |
          set -euo pipefail

          secret_matches="$({
            git grep -nI -E \
              '(sk_(live|test)_[[:alnum:]]{16,}|rk_(live|test)_[[:alnum:]]{16,}|whsec_[[:alnum:]]{16,}|AIza[[:alnum:]_-]{30,}|AKIA[0-9A-Z]{16}|gh[pousr]_[[:alnum:]]{20,}|-----BEGIN ((RSA|EC|OPENSSH) )?PRIVATE KEY-----)' \
              -- . ':(exclude).github/workflows/ci.yml'
          } || true)"

          if [[ -n "$secret_matches" ]]; then
            echo "Motifs de secrets potentiels détectés :"
            echo "$secret_matches"
            exit 1
          fi

      - name: Bloquer le paiement Stripe natif dans les builds mobiles
        shell: bash
        run: |
          set -euo pipefail

          violations="$({
            git grep -nI -E \
              'flutter_stripe|stripe_native_payment_service|StripeNativePaymentService|Stripe\.(instance|publishableKey|urlScheme)|STRIPE_(PUBLISHABLE_KEY|URL_SCHEME)|PaymentSheet|flutterstripe' \
              -- \
              lib \
              pubspec.yaml \
              android/app/src/main/AndroidManifest.xml \
              ios/Runner/Info.plist
          } || true)"

          if [[ -n "$violations" ]]; then
            echo "::error title=Paiement Stripe natif interdit::La livraison mobile doit utiliser les achats intégrés des stores."
            echo "$violations"
            exit 1
          fi

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Installer Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Afficher les versions
        run: flutter --version

      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Autoriser le wrapper Gradle
        run: chmod +x android/gradlew

      - name: Vérifier le format du code et des tests
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyser l'application et les tests
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Exécuter les tests avec couverture
        run: flutter test --coverage --reporter expanded

      - name: Compiler la cible Web en release
        run: >-
          flutter build web --release
          --dart-define=APP_ENVIRONMENT=staging
          --dart-define=API_BASE_URL=https://ci.index-canada.example/_functions

      - name: Compiler le bundle Android release sans signature
        shell: bash
        env:
          GRADLE_OPTS: -Dorg.gradle.project.indexCanada.allowUnsignedRelease=true
        run: |
          set -euo pipefail

          android_log="$(mktemp)"
          set +e
          flutter build appbundle --release \
            --dart-define=APP_ENVIRONMENT=staging \
            --dart-define=API_BASE_URL=https://ci.index-canada.example/_functions \
            2>&1 | tee "$android_log"
          build_status="${PIPESTATUS[0]}"
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            diagnostic="$(tail -n 80 "$android_log" | sed -E $'s/\\x1B\\[[0-9;]*[mK]//g')"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Compilation Android échouée::$diagnostic"
            exit "$build_status"
          fi

          bundle_path="$(find build/app/outputs/bundle/release \
            -maxdepth 1 -type f -name '*.aab' -print -quit)"
          if [[ -z "$bundle_path" ]]; then
            echo "::error title=Bundle Android absent::Le bundle Android release est introuvable."
            exit 1
          fi

          if unzip -Z1 "$bundle_path" \
            | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC)$' > /dev/null; then
            echo "::error title=Bundle Android signé::Le bundle CI ne doit pas être signé."
            exit 1
          fi

  ios-build:
    name: Compilation iOS
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer CocoaPods 1.17.0
        shell: bash
        run: |
          set -euo pipefail

          if ! gem list --local --installed cocoapods --version 1.17.0; then
            sudo gem install cocoapods --version 1.17.0 --no-document
          fi

          pod_version="$(pod --version)"
          if [[ "$pod_version" != "1.17.0" ]]; then
            echo "::error title=Version CocoaPods inattendue::CocoaPods 1.17.0 est requis, version détectée : $pod_version."
            exit 1
          fi

      - name: Vérifier Xcode 26 et le SDK iOS 26
        shell: bash
        run: |
          set -euo pipefail

          xcode_version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_major="${ios_sdk_version%%.*}"

          uname -m
          xcode-select -p
          echo "Xcode $xcode_version"
          echo "SDK iOS $ios_sdk_version"
          pod --version

          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "::error title=Xcode trop ancien::Xcode 26 ou ultérieur est requis."
            exit 1
          fi
          if [[ ! "$ios_sdk_major" =~ ^[0-9]+$ ]] || (( ios_sdk_major < 26 )); then
            echo "::error title=SDK iOS trop ancien::Le SDK iOS 26 ou ultérieur est requis."
            exit 1
          fi

      - name: Installer Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Installer les dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Vérifier le manifeste des plugins iOS
        shell: bash
        run: |
          set -euo pipefail

          manifest=.flutter-plugins-dependencies
          if [[ ! -s "$manifest" ]]; then
            echo "::error title=Manifeste Flutter absent::$manifest n'a pas été généré."
            exit 1
          fi

          if ! jq -e '.swift_package_manager_enabled.ios == true' "$manifest" >/dev/null; then
            echo "::error title=SwiftPM iOS désactivé::Flutter 3.47.4 doit générer swift_package_manager_enabled.ios=true."
            jq '{version, swift_package_manager_enabled}' "$manifest"
            exit 1
          fi

          if ! jq -e '.plugins.ios | any(.name == "in_app_purchase_storekit" and .native_build == true)' "$manifest" >/dev/null; then
            echo "::error title=Plugin StoreKit absent::in_app_purchase_storekit doit être un plugin iOS natif."
            jq '[.plugins.ios[] | {name, native_build}]' "$manifest"
            exit 1
          fi

      - name: Déterminer le mode de synchronisation iOS
        id: ios_dependency_mode
        shell: bash
        run: |
          set -euo pipefail

          project_file=ios/Runner.xcodeproj/project.pbxproj
          scheme_file=ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          project_migrated=false
          scheme_migrated=false

          if grep -Fq 'FlutterGeneratedPluginSwiftPackage' "$project_file"; then
            project_migrated=true
          fi
          if grep -Fq 'xcode_backend.sh' "$scheme_file"; then
            scheme_migrated=true
          fi

          if [[ "$project_migrated" == "true" && "$scheme_migrated" == "true" ]]; then
            mode=verification
          elif [[ "$project_migrated" == "false" && "$scheme_migrated" == "false" ]]; then
            mode=collection
          else
            echo "::error title=Migration SwiftPM partielle::Le projet Xcode et le schéma Runner doivent être migrés ensemble."
            exit 1
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode des dépendances iOS : $mode"

      - name: Synchroniser les dépendances CocoaPods
        shell: bash
        working-directory: ios
        env:
          IOS_DEPENDENCY_MODE: ${{ steps.ios_dependency_mode.outputs.mode }}
        run: |
          set -euo pipefail

          if [[ "$IOS_DEPENDENCY_MODE" == "verification" ]]; then
            pod install --deployment
          else
            pod install
          fi

      - name: Préparer le projet iOS avec SwiftPM
        run: >-
          flutter build ios --release --no-codesign --config-only --no-pub
          --dart-define=APP_ENVIRONMENT=staging
          --dart-define=API_BASE_URL=https://ci.index-canada.example/_functions

      - name: Contrôler ou collecter la migration SwiftPM
        id: ios_migration
        shell: bash
        env:
          IOS_DEPENDENCY_MODE: ${{ steps.ios_dependency_mode.outputs.mode }}
        run: |
          set -euo pipefail

          allowed_ios_files=(
            ios/Flutter/AppFrameworkInfo.plist
            ios/Podfile.lock
            ios/Runner.xcodeproj/project.pbxproj
            ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          )
          changed_ios_files=()
          while IFS= read -r changed_file; do
            if [[ -n "$changed_file" ]]; then
              changed_ios_files+=("$changed_file")
            fi
          done < <(git diff --name-only HEAD -- ios)

          unexpected_ios_files=()
          for changed_file in "${changed_ios_files[@]}"; do
            allowed=false
            for allowed_file in "${allowed_ios_files[@]}"; do
              if [[ "$changed_file" == "$allowed_file" ]]; then
                allowed=true
                break
              fi
            done
            if [[ "$allowed" != "true" ]]; then
              unexpected_ios_files+=("$changed_file")
            fi
          done

          if (( ${#unexpected_ios_files[@]} > 0 )); then
            printf '::error title=Fichiers iOS inattendus::La migration a modifié des fichiers suivis hors liste : %s\n' "${unexpected_ios_files[*]}"
            git diff --stat HEAD -- ios
            exit 1
          fi

          if [[ "$IOS_DEPENDENCY_MODE" == "verification" ]]; then
            if (( ${#changed_ios_files[@]} > 0 )); then
              git diff --check HEAD -- "${allowed_ios_files[@]}"
              git diff HEAD -- "${allowed_ios_files[@]}"
              echo "::error title=Dépendances iOS non reproductibles::pod install --deployment et la préparation SwiftPM doivent laisser le projet intact."
              exit 1
            fi

            echo "migration_required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          project_file=ios/Runner.xcodeproj/project.pbxproj
          scheme_file=ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          if ! grep -Fq 'FlutterGeneratedPluginSwiftPackage' "$project_file"; then
            echo "::error title=Projet SwiftPM incomplet::FlutterGeneratedPluginSwiftPackage est absent du projet Xcode généré."
            exit 1
          fi
          if ! grep -Fq 'xcode_backend.sh' "$scheme_file"; then
            echo "::error title=Schéma SwiftPM incomplet::Le script de préparation Flutter est absent du schéma Runner généré."
            exit 1
          fi

          required_migration_files=("$project_file" "$scheme_file")
          missing_migration_files=()
          for required_file in "${required_migration_files[@]}"; do
            found=false
            for changed_file in "${changed_ios_files[@]}"; do
              if [[ "$changed_file" == "$required_file" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != "true" ]]; then
              missing_migration_files+=("$required_file")
            fi
          done

          if (( ${#missing_migration_files[@]} > 0 )); then
            printf "::error title=Patch SwiftPM incomplet::Ces fichiers de migration obligatoires n'ont pas été modifiés : %s\n" "${missing_migration_files[*]}"
            git diff --stat HEAD -- "${allowed_ios_files[@]}"
            exit 1
          fi

          patch_path="$RUNNER_TEMP/index-canada-ios-swiftpm-migration.patch"
          git diff --check HEAD -- "${allowed_ios_files[@]}"
          git diff --binary HEAD -- "${allowed_ios_files[@]}" > "$patch_path"
          test -s "$patch_path"
          echo "migration_required=true" >> "$GITHUB_OUTPUT"
          echo "patch_path=$patch_path" >> "$GITHUB_OUTPUT"

      - name: Publier le patch de migration SwiftPM
        if: steps.ios_migration.outputs.migration_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: index-canada-ios-swiftpm-migration-${{ github.sha }}
          path: ${{ steps.ios_migration.outputs.patch_path }}
          if-no-files-found: error
          retention-days: 1

      - name: Arrêter jusqu'à l'intégration de la migration SwiftPM
        if: steps.ios_migration.outputs.migration_required == 'true'
        shell: bash
        run: |
          echo "::error title=Migration SwiftPM à intégrer::Téléchargez l'artefact de ce run, appliquez son patch sur la même révision puis versionnez uniquement les fichiers iOS autorisés."
          exit 1

      - name: Compiler la cible iOS sans signature
        run: >-
          flutter build ios --release --no-codesign --no-pub
          --dart-define=APP_ENVIRONMENT=staging
          --dart-define=API_BASE_URL=https://ci.index-canada.example/_functions

      - name: Vérifier la propreté iOS après compilation
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet HEAD -- ios; then
            git diff --stat HEAD -- ios
            echo "::error title=Projet iOS modifié::La compilation de vérification doit laisser tous les fichiers iOS suivis intacts."
            exit 1
          fi
